name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.2). Must already exist and match version."
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release author
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          if [[ "${GITHUB_ACTOR}" != "${REPOSITORY_OWNER}" ]]; then
            echo "Only ${REPOSITORY_OWNER} may publish a release" >&2
            exit 1
          fi

      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          cargo_version=$(sed -n '/^version = / { s/version = "\([^"]*\)"/\1/p; q; }' apps/desktop/src-tauri/Cargo.toml)
          test "${version}" = "${package_version}"
          test "${version}" = "${cargo_version}"
          test "${TAG}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this version is already published
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          state=$(gh release view "v${VERSION}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || true)
          if [[ "${state}" = "published" ]]; then
            echo "Version ${VERSION} is already published; nothing to do."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Publish (windows-x86_64)
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Cursor BYOK ${{ needs.prepare.outputs.tag }}
          releaseBody: "Personal build (Windows x64). Download the installer from the assets below."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: "--bundles nsis"

  finalize:
    name: Publish GitHub Release
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --latest