name: Build Windows (Cursor助手)

# 云端编译：生成 Windows 可执行程序（zip + exe + sha256）
# 触发方式：
#   - 手动：仓库 Actions 页面 → 本工作流 → Run workflow（可选分支/标签）
#   - 自动：推送 v* 标签时构建并发布 GitHub Release
# 仅作用于 youzhiqingw/cursor-byok

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或标签（默认 main）"
        required: false
        default: "main"
      release_notes:
        description: "附加到 Release 的说明（仅标签推送时生效）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows amd64
    runs-on: windows-2022
    # 仅在自己的仓库运行（防止 fork/他人仓库意外启用）
    if: github.repository == 'youzhiqingw/cursor-byok'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: 准备 Yarn
        shell: pwsh
        run: |
          if (-not (Get-Command yarn -ErrorAction SilentlyContinue)) {
            npm install -g yarn
          }
          yarn --version

      - name: 安装 task (go-task)
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          $goBin = go env GOPATH
          echo "$goBin\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 安装 wails3 CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: 安装 protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.0"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 protoc 插件（生成 gen/ 需要）
        shell: pwsh
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1

      - name: 安装 zip 工具（task 打包 zip 需要）
        shell: pwsh
        run: choco install zip -y --no-progress

      - name: 生成 proto Go 代码 (gen/)
        shell: pwsh
        run: |
          protoc --version
          task common:generate:proto
          (Get-ChildItem gen -Recurse -Filter *.go | Measure-Object).Count

      - name: 构建 Windows 可执行程序并打包
        shell: pwsh
        run: |
          task build:windows:amd64 ZIP_NAME=windows-64.zip SCAN=true
          Get-ChildItem bin | Select-Object Name, Length

      - name: 提取 exe 并生成校验和
        shell: pwsh
        run: |
          Expand-Archive -Path bin/windows-64.zip -DestinationPath bin/extracted -Force
          Copy-Item bin/extracted/*.exe bin/windows-64.exe -Force
          Get-FileHash bin/windows-64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  windows-64.exe" } | Out-File bin/windows-64.exe.sha256
          Get-ChildItem bin | Select-Object Name, Length

      - name: 上传构件（zip / exe / sha256）
        uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-windows-amd64-${{ github.sha }}
          path: |
            bin/windows-64.zip
            bin/windows-64.exe
            bin/windows-64.exe.sha256
          if-no-files-found: error

      - name: 发布 GitHub Release（标签推送时）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "${{ inputs.release_notes }}"
          $assets = "bin/windows-64.zip", "bin/windows-64.exe", "bin/windows-64.exe.sha256"
          if ($notes) {
            gh release create $tag $assets --title $tag --notes $notes 2>$null
          } else {
            gh release create $tag $assets --title $tag --generate-notes 2>$null
          }
          if ($LASTEXITCODE -ne 0) {
            # Release 已存在则仅补充构件
            gh release upload $tag $assets
          }
          gh release view $tag