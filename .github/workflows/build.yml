name: Build desktop (manual)

on:
  workflow_dispatch:
    inputs:
      include_windows:
        description: Build Windows installer
        type: boolean
        default: true
      include_macos:
        description: Build macOS (universal-ish: arm64 + x64)
        type: boolean
        default: false
      include_linux:
        description: Build Linux bundle
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: ""
            args: "--bundles nsis"
            include: ${{ github.event.inputs.include_windows }}
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            args: ""
            include: ${{ github.event.inputs.include_macos }}
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: ""
            include: ${{ github.event.inputs.include_macos }}
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: ""
            args: ""
            include: ${{ github.event.inputs.include_linux }}
    runs-on: ${{ matrix.os }}
    if: ${{ matrix.include }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop app
        working-directory: apps/desktop
        run: npm run tauri build -- ${{ matrix.args }} ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Locate build artifacts
        id: locate
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == windows* ]]; then
            echo "path=apps/desktop/src-tauri/target/release/bundle" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.platform }}" == macos* ]]; then
            echo "path=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" >> "$GITHUB_OUTPUT"
          else
            echo "path=apps/desktop/src-tauri/target/release/bundle" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-${{ matrix.platform }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: warn
          retention-days: 14
